<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rolex Oyster Perpetual | Parçalarına Ayrılan Gerçek Saat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #0b1926;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    /* 400vh Sanal Kaydırma Alanı */
    #scrollContainer {
      position: relative;
      width: 100%;
      height: 400vh;
    }

    /* Ekrana Sabitlenmiş Görünüm */
    .viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* Orijinal fotoğraftaki gökyüzü ve su yansıması geçişi */
      background: radial-gradient(circle at 50% 30%, #76baf2 0%, #3e81b6 40%, #153754 75%, #0b1926 100%);
    }

    .water-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 32vh;
      background: linear-gradient(to bottom, rgba(54, 115, 161, 0.25) 0%, rgba(11, 25, 38, 0.95) 90%);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      pointer-events: none;
      z-index: 1;
    }

    /* Üst Minimalist Başlık (Saatin üzerinde değil, en tepede ince durur) */
    .top-header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 50;
      pointer-events: none;
    }

    .top-header h1 {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 600;
    }

    .top-header p {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-top: 2px;
    }

    /* SAAT SAHNESİ: EKRANIN TAM ORTASINDA VE ÖNÜ %100 AÇIK */
    .watch-stage {
      position: relative;
      width: 85vw;
      max-width: 440px;
      height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    /* Gerçek Fotoğraf Katmanları - GPU Hızlandırmalı (60 FPS) */
    .watch-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      will-change: transform, opacity;
    }

    /* 1. Birleşik Gerçek Saat Görseli */
    #watchMerged {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    /* 2. Parçalarına Ayrılmış Gerçek Saat Görseli */
    #watchExploded {
      opacity: 0;
      transform: translate3d(0, 20px, 0) scale(0.96);
    }

    /* Alt İlerleme Çubuğu */
    .bottom-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: #38bdf8;
      border-radius: 2px;
    }

    .status-text {
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    }

    .scroll-arrow {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      animation: pulse 1.5s infinite;
      pointer-events: none;
      z-index: 40;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.8; }
      50% { transform: translate(-50%, 6px); opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="water-line"></div>

    <!-- Üst Başlık -->
    <div class="top-header">
      <h1>Rolex Oyster Perpetual</h1>
      <p id="stateSubtitle">BİRLEŞİK MONTAJLI SAAT</p>
    </div>

    <!-- SAAT SAHNESİ -->
    <div class="watch-stage">
      <!-- 1. BİRLEŞİK GERÇEK SAAT FOTOĞRAFI -->
      <img 
        id="watchMerged" 
        src="saat_birlesik.jpg" 
        alt="Rolex Oyster Perpetual Gerçek Saat"
        class="watch-layer"
      />

      <!-- 2. PARÇALARINA AYRILMIŞ GERÇEK SAAT FOTOĞRAFI -->
      <img 
        id="watchExploded" 
        src="saat_parcali.png" 
        alt="Rolex Oyster Perpetual Parçalara Ayrılmış Saat"
        class="watch-layer"
      />
    </div>

    <!-- Kaydırma İpucu -->
    <div class="scroll-arrow" id="scrollArrow">
      Aşağı Kaydırın ↓
    </div>

    <!-- Alt İlerleme Çubuğu -->
    <div class="bottom-bar">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="status-text" id="statusText">BİRLEŞİK (%0)</span>
    </div>
  </div>

  <!-- SANAL KAYDIRMA YOLU -->
  <div id="scrollContainer"></div>

  <script>
    // -------------------------------------------------------------
    // SAF 60 FPS GPU TABANLI GEÇİŞ MOTORU
    // -------------------------------------------------------------
    const watchMerged = document.getElementById('watchMerged');
    const watchExploded = document.getElementById('watchExploded');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const stateSubtitle = document.getElementById('stateSubtitle');
    const scrollArrow = document.getElementById('scrollArrow');

    let currentP = 0;
    let targetP = 0;

    // 1. Mouse Tekerleği (Desktop)
    window.addEventListener('wheel', (e) => {
      targetP += e.deltaY * 0.0008;
      targetP = Math.max(0, Math.min(1, targetP));
    }, { passive: true });

    // 2. Sayfa Kaydırması
    window.addEventListener('scroll', () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll > 0) {
        targetP = Math.max(0, Math.min(1, window.scrollY / maxScroll));
      }
    }, { passive: true });

    // 3. Mobil Dokunmatik Kaydırma (Touch Swipe)
    let touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      const touchY = e.touches[0].clientY;
      const deltaY = touchStartY - touchY;
      touchStartY = touchY;
      targetP += deltaY * 0.0028;
      targetP = Math.max(0, Math.min(1, targetP));
    }, { passive: true });

    // 60 / 120 FPS Donanım Hızlandırmalı Render Döngüsü
    function render() {
      requestAnimationFrame(render);

      // Pürüzsüz yaylanma
      currentP += (targetP - currentP) * 0.14;
      const p = currentP;

      // 1. Birleşik Gerçek Saat: Aşağı kaydırdıkça solar ve hafif yukarı süzülür
      const mergedOpacity = Math.max(0, 1 - (p * 1.5));
      const mergedY = -20 * p;
      const mergedScale = 1 - (0.04 * p);
      watchMerged.style.opacity = mergedOpacity;
      watchMerged.style.transform = `translate3d(0, ${mergedY}px, 0) scale(${mergedScale})`;

      // 2. Parçalanmış Gerçek Saat: Aşağı kaydırdıkça belirir ve yerine oturur
      const explodedOpacity = Math.min(1, Math.max(0, (p - 0.1) * 1.35));
      const explodedY = 20 * (1 - p);
      const explodedScale = 0.95 + (0.05 * p);
      watchExploded.style.opacity = explodedOpacity;
      watchExploded.style.transform = `translate3d(0, ${explodedY}px, 0) scale(${explodedScale})`;

      // UI Güncellemeleri
      const pct = Math.round(p * 100);
      progressFill.style.width = pct + '%';

      if (p > 0.05) {
        scrollArrow.style.opacity = '0';
      } else {
        scrollArrow.style.opacity = '1';
      }

      if (p < 0.2) {
        statusText.textContent = `BİRLEŞİK (%${pct})`;
        statusText.style.color = '#10b981';
        stateSubtitle.textContent = 'BİRLEŞİK MONTAJLI SAAT';
      } else if (p > 0.8) {
        statusText.textContent = `PARÇALARA AYRILDI (%${pct})`;
        statusText.style.color = '#38bdf8';
        stateSubtitle.textContent = 'KATMANLARINA AYRILMIŞ ANATOMİ';
      } else {
        statusText.textContent = `AYRIŞIYOR (%${pct})`;
        statusText.style.color = '#f59e0b';
        stateSubtitle.textContent = 'MEKANİK KATMAN GEÇİŞİ';
      }
    }

    render();
  </script>
</body>
</html>
